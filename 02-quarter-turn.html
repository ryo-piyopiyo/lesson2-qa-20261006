function parseNumber(input){

 const tokens=[];

 function atom(depth){if(depth>24)throw Error('括弧が深すぎます．');const t=tokens[p++];if(!t)throw Error('数式を最後まで入力してください．');if(t.type==='n')return t.value;if(t.type==='+')return atom(depth+1);if(t.type==='-')return -atom(depth+1);if(t.type==='√'){const n=atom(depth+1);if(n<0)throw Error('根号の中は0以上の数にしてください．');return Math.sqrt(n);}if(t.type==='('){const n=add(depth+1);if(!tokens[p]||tokens[p++].type!==')')throw Error('括弧を閉じてください．');return n;}throw Error('数式の書き方を確かめてください．');}

 function graph(k,show){const q=task(),basis=k==='matrix',sources=basis?[[1,0],[0,1]]:[q.points[k==='P'?0:1].p],range=basis?1.6:Math.max(3,...sources.flat().map(Math.abs))+1,unit=115/range,pos=p=>[150+p[0]*unit,150-p[1]*unit],step=basis?.5:1;let svg='';

 function graph(k,show){
  const q=task(),basis=k==='matrix',sources=basis?[[1,0],[0,1]]:[q.point.p],range=basis?1.6:Math.max(3,...sources.flat().map(Math.abs),...C.apply(q.A,q.point.p).map(Math.abs))+1,unit=112/range,pos=p=>[150+p[0]*unit,150-p[1]*unit],step=basis?.5:range>8?2:1;let svg='';

  return '<svg class="rotation-plot" viewBox="0 0 300 300" role="img" aria-label="'+names[k]+'を確かめる図">'+svg+'<circle class="plot-origin" cx="150" cy="150" r="2.5" fill="#000"/></svg>'+(show&&!basis?'<p class="math rotation-point-result">P′ = ('+esc(C.rotationPointText(q.angle,q.point.p).join(', '))+')</p>':'')+'<p class="tiny">1目盛りは'+C.exact(step)+'です．'+(show?'破線は元の点，実線は回転後の行き先です．':'答えを確認すると，回転後の行き先を表示します．')+'</p>';
 }
 function updateMath(){if(data.phase==='guided'){if($('plot-guided'))$('plot-guided').innerHTML=graph(parts[data.guided.stage],true);return;}const p=current(),q=task();for(const k of p.scope){if($('plot-'+k))$('plot-'+k).innerHTML=graph(k,known(p,k));if($('lhs-'+k))$('lhs-'+k).innerHTML=(known(p,'matrix')?matrix(q.A,2):'R')+matrix(q.point.p)+' =';if($('solution-'+k))$('solution-'+k).disabled=!ready(p,k);if($('hint-'+k))$('hint-'+k).disabled=!ready(p,k);}}
